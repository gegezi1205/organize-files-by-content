interface:
  display_name: "文件｜按内容整理与自动归档"
  short_description: "新文件放进 00_待归档，去向明确的会自动改名归档"
  default_prompt: "使用 $organize-files-by-content 整理我明确指定的范围。先问职业、职位等必要信息，其余问题给短选项；常见工作类型也让我逐项确认，有遗漏再给下一组。判断文件放哪时，读完整正文，再看谁发来的、讲什么、要交给谁、为什么留着、原来放在哪、旁边有哪些材料、时间和版本，以及这些信息是否互相冲突。至少要有两处彼此独立的信息对得上，不能只凭一个词或因为没写岗位术语就决定去向。普通文件按正文改名归档；压缩包通过安全检查后按整套材料处理；文字图片只有四个方向中某个结果明显更好时才转正。新配置使用 schema 3 和 00_待归档，解压与图片旋转另行授权。职业信息只帮助理解材料，不直接变成目录。先给我完整预览，保护正式材料包，拿不准的文件保持原位，等我确认后再执行。"
