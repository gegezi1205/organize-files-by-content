interface:
  display_name: "文件｜通用内容智能整理"
  short_description: "按职业画像、用途和上下文安全归档文件、图片及压缩包"
  default_prompt: "使用 $organize-files-by-content 先确认整理范围，只让我填写职业、职位等必要身份信息，其他画像元素都提供短选项；让我用编号确认常见工作类型，未覆盖时继续给下一组。逐份材料综合来源角色、业务对象、材料体裁、责任流向、直接/间接/组织战略/外部参考等关联层级、实际留存用途、稳定上下文、时间版本和反证，至少两个语义维度印证，不能凭单一短语或缺少主业词定类。普通文件自动按正文改名归位；压缩包安全解压并按主件一致性整包归档；文字图片仅在四向OCR优势明确时纠正方向。新配置使用schema 3和00_待归档，媒体处理须有明确授权。职业只作判断元素，先生成全量预览并保护正式包和歧义项，经我确认后再执行。"
