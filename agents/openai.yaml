interface:
  display_name: "文件｜通用内容智能整理"
  short_description: "先确认职业与工作画像，再按习惯、用途和上下文安全整理文件"
  default_prompt: "使用 $organize-files-by-content 先确认整理范围，只让我填写职业、职位等必要身份信息，其他画像元素都提供短选项；让我用编号确认常见工作类型，未覆盖时继续给下一组。逐份材料综合来源角色、业务对象、材料体裁、责任流向、直接/间接/组织战略/外部参考等关联层级、实际留存用途、稳定上下文、时间版本和反证，至少两个语义维度印证，不能凭单一短语或缺少主业词定类。职业只作判断元素而不直接生成目录，生成全量预览并保护正式包和歧义项，经我确认后再执行。"
